name: Build IGImax V129 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-patch/**"
      - ".github/workflows/build-apk-v128.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Extract and apply V129 patch
        run: |
          apt-get update
          apt-get install -y unzip openjdk-17-jdk-headless
          rm -rf extracted
          mkdir -p extracted
          unzip -q IGImax_V127_Android_Ready.zip -d extracted
          PROJECT="$GITHUB_WORKSPACE/extracted/IGImax_V127_Android_APK"
          test -f "$PROJECT/project.godot"
          cp android-patch/main.gd "$PROJECT/main.gd"
          cp android-patch/project.godot "$PROJECT/project.godot"
          cp android-patch/export_presets.cfg "$PROJECT/export_presets.cfg"
          mkdir -p "$PROJECT/assets/branding"
          cp android-patch/assets/igimax-icon.jpg "$PROJECT/assets/branding/igimax-icon.jpg"
          cp android-patch/assets/igimax-splash.jpg "$PROJECT/assets/branding/igimax-splash.jpg"
          sed -i 's#^gradle_build/use_gradle_build=.*#gradle_build/use_gradle_build=false#' "$PROJECT/export_presets.cfg"
          sed -i 's#^gradle_build/min_sdk=.*#gradle_build/min_sdk=""#' "$PROJECT/export_presets.cfg"
          sed -i 's#^gradle_build/target_sdk=.*#gradle_build/target_sdk=""#' "$PROJECT/export_presets.cfg"
          sed -i 's#^version/code=.*#version/code=129#' "$PROJECT/export_presets.cfg"
          sed -i 's#^version/name=.*#version/name="1.29"#' "$PROJECT/export_presets.cfg"
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"
          fi

      - name: Configure Android tools
        run: |
          CLEAN_SDK="/opt/android-sdk"
          rm -rf "$CLEAN_SDK"
          mkdir -p "$CLEAN_SDK"
          yes | sdkmanager --sdk_root="$CLEAN_SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$CLEAN_SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$TEMPLATE_DIR/"
          JAVA_DIR="/usr/lib/jvm/java-17-openjdk-amd64"
          export JAVA_HOME="$JAVA_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/opt/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          EOF

      - name: Import and build V129
        env:
          ANDROID_HOME: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --editor --path extracted/IGImax_V127_Android_APK --quit
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path extracted/IGImax_V127_Android_APK --export-debug "Android" "$GITHUB_WORKSPACE/build/IGImax-V129-Controls-Fix.apk"

      - name: Verify APK
        run: test -s build/IGImax-V129-Controls-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V129-Controls-Fix
          path: build/IGImax-V129-Controls-Fix.apk
          if-no-files-found: error
