name: Build IGImax Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "IGImax_V127_Android_Ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V127-Source
          path: IGImax_V127_Android_Ready.zip
          compression-level: 0
          if-no-files-found: error

      - name: Extract IGImax project
        run: |
          apt-get update
          apt-get install -y unzip openjdk-17-jdk-headless
          rm -rf extracted
          mkdir -p extracted
          unzip -q IGImax_V127_Android_Ready.zip -d extracted
          PROJECT="$GITHUB_WORKSPACE/extracted/IGImax_V127_Android_APK"
          test -f "$PROJECT/project.godot"

          # Keep the original Godot-generated Android preset.
          # Non-Gradle export in Godot 4.3 requires SDK override fields to be empty.
          sed -i 's#^gradle_build/use_gradle_build=.*#gradle_build/use_gradle_build=false#' "$PROJECT/export_presets.cfg"
          sed -i 's#^gradle_build/min_sdk=.*#gradle_build/min_sdk=""#' "$PROJECT/export_presets.cfg"
          sed -i 's#^gradle_build/target_sdk=.*#gradle_build/target_sdk=""#' "$PROJECT/export_presets.cfg"
          if ! grep -q '^textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' "$PROJECT/project.godot"
          fi

      - name: Configure Godot Android tools
        run: |
          CLEAN_SDK="/opt/android-sdk"
          rm -rf "$CLEAN_SDK"
          mkdir -p "$CLEAN_SDK"
          yes | sdkmanager --sdk_root="$CLEAN_SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$CLEAN_SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -x "$CLEAN_SDK/platform-tools/adb"
          test -x "$CLEAN_SDK/build-tools/34.0.0/aapt2"
          ls -la "$CLEAN_SDK/build-tools"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$TEMPLATE_DIR/"

          JAVA_DIR="/usr/lib/jvm/java-17-openjdk-amd64"
          export JAVA_HOME="$JAVA_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/opt/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          EOF

      - name: Import Godot project
        env:
          ANDROID_HOME: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --editor --path extracted/IGImax_V127_Android_APK --quit

      - name: Build Android APK
        env:
          ANDROID_HOME: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose \
            --path extracted/IGImax_V127_Android_APK \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/IGImax-V127-debug.apk"

      - name: Verify APK
        run: |
          test -s build/IGImax-V127-debug.apk
          ls -lh build/IGImax-V127-debug.apk

      - name: Upload IGImax APK
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V127-Android
          path: build/IGImax-V127-debug.apk
          if-no-files-found: error
