name: Build IGImax Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "IGImax_V127_Android_Ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract IGImax project
        run: |
          apt-get update
          apt-get install -y unzip
          rm -rf extracted
          mkdir -p extracted
          unzip -q IGImax_V127_Android_Ready.zip -d extracted
          test -f extracted/IGImax_V127_Android_APK/project.godot
          sed -i 's#gradle_build/use_gradle_build=false#gradle_build/use_gradle_build=true#' extracted/IGImax_V127_Android_APK/export_presets.cfg
          sed -i 's#gradle_build/min_sdk="23"#gradle_build/min_sdk="24"#' extracted/IGImax_V127_Android_APK/export_presets.cfg
          sed -i 's#gradle_build/target_sdk="34"#gradle_build/target_sdk="33"#' extracted/IGImax_V127_Android_APK/export_presets.cfg

      - name: Configure Godot Android tools
        run: |
          PROJECT="$GITHUB_WORKSPACE/extracted/IGImax_V127_Android_APK"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$TEMPLATE_DIR/"

          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cat >> "$PROJECT/export_presets.cfg" <<EOF
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor --path extracted/IGImax_V127_Android_APK --quit
          godot --headless --path extracted/IGImax_V127_Android_APK --install-android-build-template

      - name: Build Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless \
            --path extracted/IGImax_V127_Android_APK \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/IGImax-V127-debug.apk"

      - name: Verify APK
        run: test -s build/IGImax-V127-debug.apk

      - name: Upload IGImax APK
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V127-Android
          path: build/IGImax-V127-debug.apk
          if-no-files-found: error
