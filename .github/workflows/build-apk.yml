name: Build IGImax Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "IGImax_V127_Android_Ready.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V127-Source
          path: IGImax_V127_Android_Ready.zip
          compression-level: 0
          if-no-files-found: error

      - name: Extract IGImax project
        run: |
          apt-get update
          apt-get install -y unzip
          rm -rf extracted
          mkdir -p extracted
          unzip -q IGImax_V127_Android_Ready.zip -d extracted
          PROJECT="$GITHUB_WORKSPACE/extracted/IGImax_V127_Android_APK"
          test -f "$PROJECT/project.godot"

          cat > "$PROJECT/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="34"
          keystore/debug="/github/home/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          one_click_deploy/clear_previous_install=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=127
          version/name="1.27"
          package/unique_name="com.abusuleiman.igimax"
          package/name="IGImax"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""
          graphics/opengl_debug=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/custom_permissions=PackedStringArray()
          EOF

      - name: Configure Godot Android tools
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          test -x /usr/lib/android-sdk/build-tools/34.0.0/aapt2

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. "$TEMPLATE_DIR/"

          PROJECT="$GITHUB_WORKSPACE/extracted/IGImax_V127_Android_APK"
          rm -rf "$PROJECT/android"
          mkdir -p "$PROJECT/android/build"
          unzip -q "$TEMPLATE_DIR/android_source.zip" -d "$PROJECT/android/build"
          test -f "$PROJECT/android/build/build.gradle"

          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_DIR"
          EOF

      - name: Import Godot project
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --editor --path extracted/IGImax_V127_Android_APK --quit

      - name: Build Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose \
            --path extracted/IGImax_V127_Android_APK \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/IGImax-V127-debug.apk"

      - name: Verify APK
        run: |
          test -s build/IGImax-V127-debug.apk
          ls -lh build/IGImax-V127-debug.apk

      - name: Upload IGImax APK
        uses: actions/upload-artifact@v4
        with:
          name: IGImax-V127-Android
          path: build/IGImax-V127-debug.apk
          if-no-files-found: error
